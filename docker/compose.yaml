# Local development stack: PostgreSQL, schema migrations and the API.
#
#   docker compose -f docker/compose.yaml up --build
#
# Values fall back to local-only defaults. To use the repository's .env instead,
# pass it explicitly (`make up` does this automatically when .env exists):
#
#   docker compose -f docker/compose.yaml --env-file .env up --build

name: go-todo-app

x-db-password: &db-password ${DB_PASSWORD:-postgres}

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: *db-password
      POSTGRES_DB: postgres
    ports:
      - "5436:5432" # matches db.port in configs/config.yml for `go run` on the host
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.20.1
    # The password is embedded in a URL: avoid URL-reserved characters in DB_PASSWORD.
    command:
      - -path=/migrations
      - -database=postgres://postgres:${DB_PASSWORD:-postgres}@postgres:5432/postgres?sslmode=disable
      - up
    volumes:
      - ../schema:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: go-todo-app:local
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_PASSWORD: *db-password
      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:-local-dev-signing-key-do-not-use-in-production}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
